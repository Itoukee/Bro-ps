name: Database

on:
  pull_request:
    paths:
      - 'supabase/**'
      - '.github/workflows/db.yml'
  push:
    branches: [develop]
    paths:
      - 'supabase/**'
      - '.github/workflows/db.yml'

permissions:
  contents: read

jobs:
  pgtap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 3.0.0
      - name: Start a local database and apply the migrations
        run: supabase db start
      - name: Run the pgTAP tests
        run: supabase test db
